name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build IPA
        run: |
          chmod +x scripts/build-ios.sh
          mkdir -p build-work
          cp -r ios/RemoteControl/* build-work/
          cp scripts/build-ios.sh build-work/
          cp scripts/project.yml build-work/
          cd build-work
          bash build-ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-iOS
          path: RemoteControl.ipa
