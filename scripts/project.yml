name: RemoteControl
options:
  bundleIdPrefix: com.remotecontrol
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  RemoteControl:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "build*"
    info:
      path: Support/Info.plist
    entitlements:
      path: Support/RemoteControl.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecontrol.ios
        PRODUCT_NAME: RemoteControl
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

